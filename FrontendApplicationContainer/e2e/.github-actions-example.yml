# Example GitHub Actions workflow for E2E tests
# Copy this to .github/workflows/e2e-tests.yml in your repository

name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: FrontendApplicationContainer/package-lock.json
      
      - name: Install dependencies
        working-directory: ./FrontendApplicationContainer
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./FrontendApplicationContainer
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        working-directory: ./FrontendApplicationContainer
        run: npm run e2e:ci
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3000
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: FrontendApplicationContainer/e2e-report/
          retention-days: 30
      
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-traces
          path: FrontendApplicationContainer/test-results/
          retention-days: 7
